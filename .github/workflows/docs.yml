name: Documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install model and documentation dependencies
        run: python -m pip install -e '.[docs]'
      - name: Build documentation and execute Example.ipynb
        run: make docs-check PYTHON=python
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_build/html
